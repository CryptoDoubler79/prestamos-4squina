<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Préstamos 4Squina</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201b;--mute:#66736d;--line:#dfe5e2;--pri:#0f3d2e;--pri2:#1c6b4f;--acc:#d9a521;--red:#c0392b;--green:#1e8a4c;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.3px}
header small{opacity:.75;display:block;font-size:12px}
header button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
main{padding:14px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:12px;color:var(--mute)}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:600}
h2{font-size:19px;margin:6px 0 12px}
h3{font-size:15px;margin:16px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tap{cursor:pointer}
.tap:active{background:#eef3f0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat span{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:18px}
.big{font-size:20px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#e6efe9;color:var(--pri2)}
.badge.late{background:#fbe5e2;color:var(--red)}
.badge.done{background:#e3eefb;color:#2563a8}
.badge.bad{background:#eee;color:#555}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px}
label{font-size:13px;color:var(--mute)}
.btn{display:inline-block;border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:600;background:var(--pri);color:#fff;width:100%;margin-top:4px}
.btn.sec{background:#e6efe9;color:var(--pri)}
.btn.warn{background:#fbe5e2;color:var(--red)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns .btn{flex:1}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 30px}
.sheet .x{float:right;border:0;background:#e6efe9;border-radius:50%;width:32px;height:32px;font-size:18px}
.chips{display:flex;gap:8px;margin:4px 0 10px}
.chip{flex:1;text-align:center;padding:10px;border:2px solid var(--line);border-radius:11px;background:#fff;font-weight:700}
.chip.on{border-color:var(--pri);background:#e6efe9;color:var(--pri)}
.split{background:#fff;border:1px dashed var(--pri2);border-radius:10px;padding:10px;font-size:14px;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14201b;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
.center{text-align:center}
.login{max-width:380px;margin:40px auto}
.login .logo{font-size:44px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
pre.receipt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font:14px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div><h1 id="bizName">Préstamos 4Squina</h1><small id="whoami"></small></div>
  <button id="logout">Salir</button>
</header>
<main id="view"><div class="empty">Cargando…</div></main>
<nav id="nav" hidden></nav>
<div id="modalRoot"></div>

<script>
window.__diag=function(m){var v=document.getElementById('view');if(v)v.innerHTML='<div class="card"><b>Problema al cargar</b><p>'+String(m).replace(/</g,'&lt;')+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'};
window.addEventListener('error',function(e){if(!window.__ok)__diag('Error: '+(e.message||((e.target&&(e.target.src||e.target.href))?'no cargó '+(e.target.src||e.target.href):e.type)))},true);
window.addEventListener('unhandledrejection',function(e){if(!window.__ok)__diag('Error: '+(e.reason&&(e.reason.code||e.reason.message)||e.reason))});
setTimeout(function(){if(!window.__ok)__diag(window.__stage?('Se quedó en: '+window.__stage):'La app no pudo descargar sus archivos. Revisa el internet, o abre el enlace en Safari/Chrome (no dentro de otra app).')},15000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, collection, query, where, runTransaction, serverTimestamp, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { r2, todayStr, daysBetween, addMonths, loanStatus, applyPayment, buildSchedule, FREQ, waiveMora, postponeCuotas, extendReditos, validCedula, PAY_FIELDS, cuotasForTerm, ratePerCuota, monthlyToPeriod } from "./loancalc.js?v=3";

const firebaseConfig = {
  apiKey: "AIzaSyA5CFaY8Gsx3YlWf4UzVYFDxGHq66flRVU",
  authDomain: "squina-prestamos.firebaseapp.com",
  projectId: "squina-prestamos",
  storageBucket: "squina-prestamos.firebasestorage.app",
  messagingSenderId: "127306438469",
  appId: "1:127306438469:web:182e3f996ba3390319d02c"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
window.__stage = 'iniciar base de datos';
let db;
try { db = initializeFirestore(app, { experimentalForceLongPolling: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = getFirestore(app); }
const withTimeout = (p, ms = 12000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout', message: 'No se pudo conectar con la base de datos de Firebase. Revisa que la base de datos Firestore esté creada.' }), ms))]);
window.__stage = 'esperando la sesión';
// App secundaria para crear cobradores sin cerrar la sesión del admin
const app2 = initializeApp(firebaseConfig, "secundaria");
const auth2 = getAuth(app2);

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'RD$' + Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = r => (Math.round(r * 1000) / 10) + '%';
const fdate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function errMsg(e) {
  const c = e && e.code || '';
  if (c.includes('permission-denied')) return 'Sin permiso para esta acción.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email')) return 'Código incorrecto.';
  if (c.includes('email-already-in-use')) return 'Ese código ya está en uso. Elige otro.';
  if (c.includes('operation-not-allowed')) return 'El acceso no está activado en Firebase (Authentication → Email/Password).';
  if (c.includes('too-many-requests')) return 'Demasiados intentos. Espera unos minutos.';
  if (c.includes('unavailable')) return 'Sin conexión. Intenta de nuevo cuando tengas internet.';
  return e && e.message || 'Error';
}
// Acceso por código: cada código se convierte internamente en una cuenta
const validCode = c => /^[0-9]{6,10}$/.test(c);
const codeEmail = c => `c${c}@squina-prestamos.app`;
const codePass = c => `4sq#${c}#prestamos`;
function openModal(html) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal"><div class="sheet"><button class="x" data-close>×</button>${html}</div></div>`;
  root.querySelector('.modal').addEventListener('click', e => { if (e.target.classList.contains('modal') || e.target.hasAttribute('data-close')) closeModal(); });
  return root.querySelector('.sheet');
}
const closeModal = () => { $('#modalRoot').innerHTML = ''; };

// ---------- estado ----------
let me = null;           // {uid, name, email, role, owner}
let settings = { businessName: 'Préstamos 4Squina' };
let usersCache = [];
let tab = 'inicio';
const isAdmin = () => me && (me.owner || me.role === 'admin');

// ---------- consultas ----------
const qLoansActive = () => isAdmin()
  ? query(collection(db, 'loans'), where('status', '==', 'activo'))
  : query(collection(db, 'loans'), where('collectorId', '==', me.uid), where('status', '==', 'activo'));
const qLoansByClient = cid => isAdmin()
  ? query(collection(db, 'loans'), where('clientId', '==', cid))
  : query(collection(db, 'loans'), where('collectorId', '==', me.uid), where('clientId', '==', cid));
const qClients = () => isAdmin()
  ? collection(db, 'clients')
  : query(collection(db, 'clients'), where('collectorId', '==', me.uid));
const qPaysByDate = d => isAdmin()
  ? query(collection(db, 'payments'), where('date', '==', d))
  : query(collection(db, 'payments'), where('collectorId', '==', me.uid), where('date', '==', d));
const qPaysFrom = d => query(collection(db, 'payments'), where('date', '>=', d));
const qPaysByLoan = lid => isAdmin()
  ? query(collection(db, 'payments'), where('loanId', '==', lid))
  : query(collection(db, 'payments'), where('collectorId', '==', me.uid), where('loanId', '==', lid));
const qMovesByDate = d => isAdmin()
  ? query(collection(db, 'cashmoves'), where('date', '==', d))
  : query(collection(db, 'cashmoves'), where('uid', '==', me.uid), where('date', '==', d));
const rows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

async function loadUsers() {
  if (!isAdmin()) return [];
  usersCache = rows(await getDocs(collection(db, 'users')));
  return usersCache;
}
const collectorName = id => (usersCache.find(u => u.id === id) || {}).name || (id === me.uid ? me.name : '—');

// ---------- autenticación ----------
let creatingOwner = false;
function showFatal(msg) {
  window.__ok = true;
  $('#hdr').hidden = true; $('#nav').hidden = true;
  view.innerHTML = `<div class="login card center"><p>${msg}</p><button class="btn" id="out">Volver al inicio</button></div>`;
  $('#out').onclick = () => signOut(auth).then(() => showLogin());
}
const setupHint = e => (e && e.code || '').includes('permission-denied')
  ? 'Firebase bloqueó el acceso: las reglas de seguridad no están publicadas. Ve a Firestore Database → Reglas, pega las reglas y toca Publicar.'
  : 'Error: ' + esc(errMsg(e));
onAuthStateChanged(auth, async u => {
  if (creatingOwner) return;
  if (!u) { me = null; showLogin(); return; }
  try {
    window.__stage = 'leer la base de datos';
    const [ownSnap, userSnap] = await withTimeout(Promise.all([getDoc(doc(db, 'meta', 'owner')), getDoc(doc(db, 'users', u.uid))]));
    let owner = ownSnap.exists() && ownSnap.data().uid === u.uid;
    let ud = userSnap.exists() ? userSnap.data() : null;
    let ownerName = 'Dueño';
    if (!ownSnap.exists() && !ud) {
      // Todavía no hay dueño: la primera cuenta que entra se convierte en dueño
      ownerName = (prompt('Esta será la cuenta del dueño. ¿Cuál es tu nombre?') || '').trim() || 'Dueño';
      window.__stage = 'crear la cuenta del dueño';
      await withTimeout(setDoc(doc(db, 'meta', 'owner'), { uid: u.uid, createdAt: serverTimestamp() }));
      owner = true;
    }
    if (owner && !ud) {
      ud = { name: ownerName, email: u.email, role: 'admin', active: true, createdAt: serverTimestamp() };
      await withTimeout(setDoc(doc(db, 'users', u.uid), ud));
    }
    if (!ud && ownSnap.exists()) return showFatal('Ya hay otra cuenta registrada como dueño (probablemente de una prueba que falló). Para arreglarlo, abre <a href="https://console.firebase.google.com/project/squina-prestamos/firestore/databases/-default-/data/~2Fmeta~2Fowner" target="_blank">este enlace de Firebase</a>, borra el documento <b>owner</b> (los 3 puntos → Eliminar documento) y vuelve a entrar con tu código.');
    if (!ud || ud.active === false) return showFatal('Esta cuenta no tiene acceso. Pide al administrador que la active.');
    me = { uid: u.uid, email: u.email, name: ud.name, role: ud.role, owner };
    try { const s = await getDoc(doc(db, 'meta', 'settings')); if (s.exists()) settings = { ...settings, ...s.data() }; } catch (_) {}
    await loadUsers();
    startApp();
  } catch (e) { showFatal(setupHint(e)); }
});

function showLogin(mode = 'login') {
  window.__ok = true;
  $('#hdr').hidden = true; $('#nav').hidden = true;
  const first = mode === 'owner';
  view.innerHTML = `<div class="login">
    <div class="logo">💰</div>
    <h2 class="center">${esc(settings.businessName)}</h2>
    <div class="card">
      ${first ? `<p class="mute">Crea la cuenta del dueño. Solo se puede hacer una vez; la primera cuenta creada será el administrador principal.</p>
      <label>Tu nombre</label><input id="lname" autocomplete="name">` : ''}
      <label>${first ? 'Elige tu código (6 a 10 números)' : 'Código de acceso'}</label>
      <input id="lcode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" style="font-size:24px;letter-spacing:6px;text-align:center">
      ${first ? `<label>Repite el código</label><input id="lcode2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" style="font-size:24px;letter-spacing:6px;text-align:center">` : ''}
      <button class="btn" id="lgo">${first ? 'Crear cuenta de dueño' : 'Entrar'}</button>
      <p class="center mute" style="margin-top:14px"><a href="#" id="lswitch">${first ? 'Ya tengo cuenta' : 'Primera vez: crear cuenta de dueño'}</a></p>
    </div></div>`;
  $('#lcode').onkeydown = e => { if (e.key === 'Enter' && !first) $('#lgo').click(); };
  $('#lswitch').onclick = e => { e.preventDefault(); showLogin(first ? 'login' : 'owner'); };
  $('#lgo').onclick = async () => {
    const code = $('#lcode').value.trim();
    if (!validCode(code)) return alert('El código debe tener de 6 a 10 números.');
    if (first && code !== $('#lcode2').value.trim()) return alert('Los códigos no coinciden.');
    const email = codeEmail(code), pass = codePass(code);
    const name = first ? ($('#lname').value.trim() || 'Dueño') : '';
    $('#lgo').disabled = true; $('#lgo').textContent = 'Un momento…';
    try {
      if (!first) { await signInWithEmailAndPassword(auth, email, pass); return; }
      creatingOwner = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      try {
        const own = await getDoc(doc(db, 'meta', 'owner'));
        if (own.exists()) {
          await cred.user.delete().catch(() => {});
          creatingOwner = false;
          alert('Ya existe un dueño registrado. Entra con tu código o pide al dueño que te cree una cuenta.');
          return showLogin();
        }
        await setDoc(doc(db, 'meta', 'owner'), { uid: cred.user.uid, createdAt: serverTimestamp() });
        await setDoc(doc(db, 'users', cred.user.uid), { name, email, role: 'admin', active: true, createdAt: serverTimestamp() });
        location.reload();
      } catch (e) {
        await cred.user.delete().catch(() => {});
        creatingOwner = false;
        alert(setupHint(e));
        showLogin('owner');
      }
    } catch (e) { creatingOwner = false; alert(errMsg(e)); }
    finally { const b = $('#lgo'); if (b) { b.disabled = false; b.textContent = first ? 'Crear cuenta de dueño' : 'Entrar'; } }
  };
}
$('#logout').onclick = () => { if (confirm('¿Cerrar sesión?')) signOut(auth); };

// ---------- navegación ----------
function startApp() {
  window.__ok = true;
  $('#hdr').hidden = false; $('#nav').hidden = false;
  $('#bizName').textContent = settings.businessName;
  $('#whoami').textContent = `${me.name} · ${isAdmin() ? 'Administrador' : 'Cobrador'}`;
  const tabs = [['inicio', '🏠', 'Inicio'], ['cobros', '💵', 'Cobros'], ['clientes', '👥', 'Clientes'], ['caja', '🧾', 'Caja']];
  if (isAdmin()) tabs.push(['mas', '☰', 'Más']);
  $('#nav').innerHTML = tabs.map(([k, i, t]) => `<button data-tab="${k}"><b>${i}</b>${t}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
  go(tab);
}
function go(t) {
  tab = t;
  $('#nav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  view.innerHTML = '<div class="empty">Cargando…</div>';
  ({ inicio: viewInicio, cobros: viewCobros, clientes: viewClientes, caja: () => viewCaja(), mas: viewMas })[t]()
    .catch(e => view.innerHTML = `<div class="card">Error: ${esc(errMsg(e))}</div>`);
  window.scrollTo(0, 0);
}
const refresh = () => go(tab);

// ---------- utilidades extra ----------
const plazoTxt = L => L.termMonths ? ` · ${L.termMonths} ${L.termMonths === 1 ? 'mes' : 'meses'}` : '';
const typeLabel = L => L.type === 'cuotas'
  ? `${L.n} cuotas ${(FREQ[L.freq] || '').toLowerCase()}es de ${money(L.schedule && L.schedule[0] ? L.schedule[0].amount : 0)}${plazoTxt(L)}`
  : `Réditos ${pct(L.rateWeekly)} semanal${plazoTxt(L)}`;
const METHODS = { efectivo: 'Efectivo', transferencia: 'Transferencia', otro: 'Otro' };
const waLink = (phone, text) => {
  const p = String(phone || '').replace(/\D/g, '');
  return `https://wa.me/${p ? (p.length === 10 ? '1' + p : p) : ''}?text=${encodeURIComponent(text)}`;
};
function printHtml(title, body) {
  const w = window.open('', '_blank');
  if (!w) return toast('Permite ventanas emergentes para imprimir');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
  <style>body{font:14px/1.5 Georgia,serif;max-width:720px;margin:24px auto;padding:0 16px;color:#111}h1{font-size:18px;text-align:center}table{width:100%;border-collapse:collapse;font:12px Arial,sans-serif}td,th{border:1px solid #999;padding:4px}.sig{display:flex;gap:30px;margin-top:50px}.sig div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:12px}pre{white-space:pre-wrap;font:13px monospace}@media print{button{display:none}}</style>
  </head><body><button onclick="print()" style="padding:10px 16px;margin-bottom:10px">Imprimir / Guardar PDF</button>${body}</body></html>`);
  w.document.close();
}
function downloadCsv(name, header, data) {
  const cell = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [header, ...data].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
// Foto: se reduce y se guarda dentro de la base de datos (gratis, sin Storage)
function pickPhoto() {
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return resolve(null);
      const img = new Image();
      img.onload = () => {
        const max = 640, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.6)); URL.revokeObjectURL(img.src);
      };
      img.onerror = () => resolve(null);
      img.src = URL.createObjectURL(f);
    };
    inp.click();
  });
}
async function savePhoto(id, data, collectorId, kind) {
  await setDoc(doc(db, 'photos', id), { data, collectorId: collectorId || '', kind, createdAt: serverTimestamp() });
}
async function loadPhoto(id) {
  try { const s = await getDoc(doc(db, 'photos', id)); return s.exists() ? s.data().data : null; } catch (_) { return null; }
}
async function cashMove(m) {
  await addDoc(collection(db, 'cashmoves'), { date: todayStr(), byUid: me.uid, byName: me.name, createdAt: serverTimestamp(), note: '', ...m });
}

// ---------- INICIO ----------
async function viewInicio() {
  const today = todayStr();
  const monthStart = today.slice(0, 8) + '01';
  const loans = rows(await getDocs(qLoansActive()));
  const paysToday = rows(await getDocs(qPaysByDate(today))).filter(p => !p.anulado);
  let paysMonth = [], movesMonth = [];
  if (isAdmin()) {
    paysMonth = rows(await getDocs(qPaysFrom(monthStart))).filter(p => !p.anulado);
    movesMonth = rows(await getDocs(query(collection(db, 'cashmoves'), where('date', '>=', monthStart))));
  }
  let capital = 0, pend = 0, late = 0, dueToday = 0;
  loans.forEach(L => {
    const s = loanStatus(L, today); capital += s.capital; pend += s.dueNow; if (s.late) late++;
    if (L.type === 'cuotas' ? s.overdueCount > 0 : s.daysSincePay >= 7) dueToday++;
  });
  const sum = (a, k) => r2(a.reduce((t, p) => t + (p[k] || 0), 0));
  const gastosMes = r2(movesMonth.filter(m => m.type === 'gasto').reduce((t, m) => t + m.amount, 0));
  view.innerHTML = `
    <h2>Hoy, ${fdate(today)}</h2>
    <div class="grid">
      <div class="stat"><span>Cobrado hoy</span><b>${money(sum(paysToday, 'amount'))}</b></div>
      <div class="stat"><span>Pagos hoy</span><b>${paysToday.length}</b></div>
      <div class="stat tap" id="goCob"><span>Por cobrar hoy</span><b>${dueToday}</b></div>
      <div class="stat tap" id="goLate"><span>Atrasados</span><b style="color:${late ? 'var(--red)' : 'inherit'}">${late}</b></div>
    </div>
    <h3>Cartera</h3>
    <div class="grid">
      <div class="stat"><span>Capital en la calle</span><b>${money(capital)}</b></div>
      <div class="stat"><span>Vencido (interés, cuotas, mora)</span><b>${money(pend)}</b></div>
      <div class="stat"><span>Préstamos activos</span><b>${loans.length}</b></div>
      <div class="stat"><span>Mora cobrada hoy</span><b>${money(sum(paysToday, 'toMora'))}</b></div>
    </div>
    ${isAdmin() ? `<h3>Este mes</h3>
    <div class="grid">
      <div class="stat"><span>Interés + mora cobrados</span><b style="color:var(--green)">${money(sum(paysMonth, 'toInterest') + sum(paysMonth, 'toMora'))}</b></div>
      <div class="stat"><span>Capital recuperado</span><b>${money(sum(paysMonth, 'toCapital'))}</b></div>
      <div class="stat"><span>Gastos</span><b>${money(gastosMes)}</b></div>
      <div class="stat"><span>Ganancia neta</span><b style="color:var(--green)">${money(sum(paysMonth, 'toInterest') + sum(paysMonth, 'toMora') - gastosMes)}</b></div>
    </div>` : ''}
    <div class="btns" style="margin-top:16px">
      <button class="btn" id="qCobrar">💵 Cobrar</button>
      ${isAdmin() ? '<button class="btn sec" id="qNuevo">➕ Nuevo préstamo</button>' : ''}
    </div>`;
  $('#goLate').onclick = $('#goCob').onclick = $('#qCobrar').onclick = () => go('cobros');
  if ($('#qNuevo')) $('#qNuevo').onclick = () => pickClientForLoan();
}

function scheduleTable(L, asOf = todayStr()) {
  return `<table><tr><th>#</th><th>Fecha</th><th class="n">Cuota</th><th class="n">Pagado</th><th>Estado</th></tr>
    ${L.schedule.map(c => {
      const done = r2(c.amount - c.paid) <= 0.004;
      const state = done ? '<span class="badge done">Pagada</span>' : c.due < asOf ? '<span class="badge late">Vencida</span>' : c.due === asOf ? '<span class="badge late">Hoy</span>' : '<span class="badge">Pendiente</span>';
      return `<tr><td>${c.n}</td><td>${fdate(c.due)}</td><td class="n">${money(c.amount)}</td><td class="n">${money(c.paid)}</td><td>${state}</td></tr>`;
    }).join('')}</table>`;
}

async function registerPayment(loanId, amount, note, method = 'efectivo') {
  const date = todayStr();
  const loanRef = doc(db, 'loans', loanId);
  const payRef = doc(collection(db, 'payments'));
  const build = L => {
    const r = applyPayment(L, amount, date);
    const prev = {}; PAY_FIELDS.forEach(f => { prev[f] = L[f] === undefined ? null : L[f]; });
    const pay = {
      loanId, clientId: L.clientId, clientName: L.clientName, clientPhone: L.clientPhone || '',
      collectorId: L.collectorId || me.uid, byUid: me.uid, byName: me.name, loanType: L.type || 'reditos',
      amount: r2(amount), toMora: r.toMora, toInterest: r.toInterest, toCapital: r.toCapital,
      capitalAfter: r.after.capital, interestAfter: r.after.interest, moraAfter: r.after.mora, totalAfter: r.after.total,
      method, date, note: note || '', anulado: false, createdAt: serverTimestamp(), prev
    };
    return { pay, loanUpdate: { ...r.updates, lastPaymentId: payRef.id, updatedAt: serverTimestamp() } };
  };
  try {
    let out;
    await runTransaction(db, async tx => {
      const s = await tx.get(loanRef);
      const L = s.data();
      if (L.status !== 'activo') throw new Error('Este préstamo no está activo.');
      out = build(L);
      tx.set(payRef, out.pay);
      tx.update(loanRef, out.loanUpdate);
    });
    return { id: payRef.id, ...out.pay };
  } catch (e) {
    if (!(String(e.code || '').includes('unavailable') || !navigator.onLine)) throw e;
    // Sin internet: se guarda en el teléfono y se envía al volver la conexión
    const s = await getDoc(loanRef);
    const L = s.data();
    if (L.status !== 'activo') throw new Error('Este préstamo no está activo.');
    const out = build(L);
    const b = writeBatch(db); b.set(payRef, out.pay); b.update(loanRef, out.loanUpdate);
    b.commit().catch(err => toast('Un pago sin conexión no se pudo guardar: ' + errMsg(err)));
    toast('Sin internet: el pago se guardó en el teléfono y se enviará al volver la conexión.');
    return { id: payRef.id, ...out.pay, offline: true };
  }
}

async function voidPayment(p) {
  const loanRef = doc(db, 'loans', p.loanId), payRef = doc(db, 'payments', p.id);
  await runTransaction(db, async tx => {
    const L = (await tx.get(loanRef)).data();
    const P = (await tx.get(payRef)).data();
    if (P.anulado) throw new Error('Este pago ya fue anulado.');
    if (L.lastPaymentId !== p.id) throw new Error('Solo se puede anular el último pago del préstamo.');
    tx.update(loanRef, { ...P.prev, updatedAt: serverTimestamp() });
    tx.update(payRef, { anulado: true, anuladoPor: me.name, anuladoEn: serverTimestamp() });
  });
}

async function printContract(L) {
  let c = {};
  try { const s = await getDoc(doc(db, 'clients', L.clientId)); if (s.exists()) c = s.data(); } catch (_) {}
  const S = settings;
  const isC = L.type === 'cuotas';
  const moraTxt = L.mora && L.mora.type && L.mora.type !== 'none'
    ? `En caso de atraso, EL DEUDOR pagará un cargo por mora de ${L.mora.type === 'pct' ? L.mora.value + '% del monto de la cuota vencida' : money(L.mora.value)} por cada día de atraso${L.mora.grace ? `, después de ${L.mora.grace} días de gracia` : ''}.`

      phone: sh.querySelector('#cp').value.trim(), address: sh.querySelector('#ca').value.trim(),
      work: sh.querySelector('#cw').value.trim(), guarantor: sh.querySelector('#cg').value.trim(),
      collectorId: sh.querySelector('#ck').value, notes: sh.querySelector('#cnotes').value.trim(),
      blacklist: sh.querySelector('#cbl').checked, blacklistReason: sh.querySelector('#cblr').value.trim(),
      updatedAt: serverTimestamp()
    };
    if (!data.name) return toast('Escribe el nombre');
    const btn = sh.querySelector('#csave'); btn.disabled = true;
    try {
      // Revisar si la cédula ya existe en otro cliente
      if (data.cedula) {
        const dup = rows(await getDocs(query(collection(db, 'clients'), where('cedula', '==', data.cedula)))).filter(x => x.id !== c.id);
        if (dup.length && !confirm(`Ya existe un cliente con esa cédula: ${dup[0].name}${dup[0].blacklist ? ' (LISTA NEGRA)' : ''}. ¿Guardar de todas formas?`)) { btn.disabled = false; return; }
      }
      let cid = c.id;
      if (cid) {
        await updateDoc(doc(db, 'clients', cid), data);
        const ls = await getDocs(query(collection(db, 'loans'), where('clientId', '==', cid)));
        const b = writeBatch(db);
        ls.forEach(d => b.update(d.ref, { clientName: data.name, clientPhone: data.phone, collectorId: data.collectorId }));
        if (data.collectorId !== c.collectorId) {
          ls.forEach(d => b.set(doc(db, 'photos', 'g_' + d.id), { collectorId: data.collectorId }, { merge: true }));
          b.set(doc(db, 'photos', 'c_' + cid), { collectorId: data.collectorId }, { merge: true });
        }
        await b.commit().catch(() => {});
      } else {
        cid = (await addDoc(collection(db, 'clients'), { ...data, createdAt: serverTimestamp() })).id;
      }
      if (photo) await savePhoto('c_' + cid, photo, data.collectorId, 'cliente');
      closeModal(); toast(c.id ? 'Cliente actualizado' : 'Cliente creado');
      if (tab === 'clientes') refresh();

    } catch (e) { toast(errMsg(e)); btn.disabled = false; }
  };
}

function clientHistory(loans) {
  const today = todayStr();
  const h = { total: loans.length, active: 0, paid: 0, bad: 0, renewed: 0, lateNow: 0, maxLate: 0 };
  loans.forEach(L => {
    if (L.status === 'activo') { h.active++; const s = loanStatus(L, today); if (s.late) { h.lateNow++; h.maxLate = Math.max(h.maxLate, s.daysLate); } }
    else if (L.status === 'saldado') h.paid++;
    else if (L.status === 'castigado') h.bad++;
    else if (L.status === 'renovado') h.renewed++;
  });
  return h;
}

function loanForm(c, opts = {}) {
  const { renew, carried = 0, quote } = opts;
  const dm = settings.defaultMora || { type: 'none', value: 0, grace: 0 };
  let type = renew ? (renew.type || 'reditos') : 'reditos', rate = 0.20, months = renew ? (renew.termMonths || 0) : 1;
  const title = quote ? 'Cotizar préstamo' : renew ? `Renovar préstamo de ${esc(c.name)}` : `Préstamo para ${esc(c.name)}`;
  const sh = openModal(`<h2>${title}</h2>
    ${renew ? `<div class="split">Lo que debe hoy (<b>${money(carried)}</b>) pasa al nuevo préstamo. Escribe abajo solo el dinero <b>nuevo</b> que le entregas (puede ser 0).</div>` : ''}
    <div class="chips"><button class="chip ${type === 'reditos' ? 'on' : ''}" data-t="reditos">Réditos<br><small>interés diario</small></button><button class="chip ${type === 'cuotas' ? 'on' : ''}" data-t="cuotas">Cuotas fijas<br><small>con calendario</small></button></div>
    <label>${renew ? 'Dinero nuevo entregado (RD$)' : 'Monto prestado (RD$)'}</label><input id="la" type="number" inputmode="decimal" step="0.01" min="0" value="${renew ? 0 : ''}">
    <label>Plazo</label>
    <div class="chips">
      <button class="chip on" data-m="1">1 mes</button><button class="chip" data-m="2">2 meses</button><button class="chip" data-m="3">3 meses</button><button class="chip" data-m="0" id="lm0">Otro</button>
    </div>
    <div id="fred">
      <label>Interés semanal</label>
      <div class="chips">
        <button class="chip on" data-r="0.20">20%<br><small>RD$200 x mil</small></button>
        <button class="chip" data-r="0.30">30%<br><small>RD$300 x mil</small></button>
        <button class="chip" data-r="otro">Otro</button>
      </div>
      <div id="lother" hidden><label>Otro porcentaje semanal (%)</label><input id="lop" type="number" inputmode="decimal" step="0.1"></div>
      <p class="mute" id="lmatw"></p>
    </div>
    <div id="fcuo" hidden>
      <div class="grid">
        <div><label>Frecuencia</label><select id="lfq">${Object.entries(FREQ).map(([k, v]) => `<option value="${k}" ${k === 'semanal' ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div><label>Número de cuotas</label><input id="lnn" type="number" inputmode="numeric" value="4" min="1"></div>
        <div><label>Interés</label><select id="lim"><option value="mensual">% mensual</option><option value="total">% total del préstamo</option><option value="cuota">% por cuota</option></select></div>
        <div><label>Porcentaje (%)</label><input id="lrp" type="number" inputmode="decimal" step="0.1" value="20"></div>
        <div><label>Método</label><select id="lme"><option value="plano">Fijo (prestamista)</option><option value="frances">Francés (banco)</option></select></div>
      </div>
      <label id="lsunw" style="display:flex;gap:8px;align-items:center;margin-bottom:8px" hidden><input type="checkbox" id="lsun" style="width:auto;margin:0" checked> No cobrar los domingos</label>
    </div>
    <label>Mora por atraso</label>
    <div class="grid">
      <div><select id="lmt"><option value="none">Sin mora</option><option value="fijo">RD$ por día</option><option value="pct">% por día</option></select></div>
      <div><input id="lmv" type="number" inputmode="decimal" step="0.01" placeholder="Valor" value="${dm.value || ''}"></div>
    </div>
    <label>Días de gracia antes de la mora</label><input id="lmg" type="number" inputmode="numeric" value="${dm.grace || 0}">
    ${quote ? '' : `<label>Garantía (opcional)</label><input id="lcol" placeholder="Ej. matrícula de moto, TV, etc." value="${esc(renew && renew.collateral || '')}">
    <label>Nota / producto (opcional)</label><input id="lnote">
    <label>Fecha de entrega</label><input id="ld" type="date" value="${todayStr()}">`}
    <div class="split" id="lprev">Escribe el monto.</div>
    ${quote ? '' : `<button class="btn" id="lsave">${renew ? 'Renovar' : 'Crear préstamo'}</button>`}`);
  const $s = s => sh.querySelector(s);
  $s('#lmt').value = renew && renew.mora ? renew.mora.type : (dm.type || 'none');
  if (renew && renew.mora) { $s('#lmv').value = renew.mora.value || ''; $s('#lmg').value = renew.mora.grace || 0; }
  if (renew && renew.type === 'cuotas') {
    $s('#lfq').value = renew.freq; $s('#lme').value = renew.method || 'plano';
    if (renew.interestMode) { $s('#lim').value = renew.interestMode; $s('#lrp').value = renew.interestValue; }
    else { $s('#lim').value = 'cuota'; $s('#lrp').value = r2(renew.ratePeriod * 100); }
    if (!renew.termMonths) $s('#lnn').value = renew.n;
  }
  const markMonths = () => sh.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', parseInt(x.dataset.m, 10) === months));
  markMonths();
  if (renew && renew.type !== 'cuotas' && renew.rateWeekly) {
    rate = renew.rateWeekly;
    const match = [...sh.querySelectorAll('[data-r]')].find(x => parseFloat(x.dataset.r) === rate);
    sh.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x === match));
    if (!match) { sh.querySelector('[data-r="otro"]').classList.add('on'); rate = 'otro'; $s('#lother').hidden = false; $s('#lop').value = r2(renew.rateWeekly * 100); }
  }
  const params = () => {
    const principal = r2((parseFloat($s('#la').value) || 0) + (renew ? carried : 0));
    const start = $s('#ld') ? ($s('#ld').value || todayStr()) : todayStr();
    const mora = { type: $s('#lmt').value, value: parseFloat($s('#lmv').value) || 0, grace: parseInt($s('#lmg').value, 10) || 0 };
    if (type === 'reditos') {
      const r = rate === 'otro' ? (parseFloat($s('#lop').value) || 0) / 100 : rate;
      return { type, principal, rateWeekly: r, start, mora, termMonths: months, maturityDate: months ? addMonths(start, months) : null };
    }
    const freq = $s('#lfq').value, skipSundays = freq === 'diario' && $s('#lsun').checked;
    if (months) $s('#lnn').value = cuotasForTerm(start, freq, months, skipSundays);
    $s('#lnn').disabled = !!months;
    const n = parseInt($s('#lnn').value, 10) || 0, method = $s('#lme').value;
    const interestMode = $s('#lim').value, interestValue = parseFloat($s('#lrp').value) || 0;
    const termForRate = months || (n * ({ diario: 1, semanal: 7, quincenal: 15, mensual: 30 }[freq]) / 30);
    const ratePeriod = method === 'frances' && interestMode === 'mensual'
      ? monthlyToPeriod(interestValue / 100, freq)
      : ratePerCuota(interestMode, interestValue, termForRate, n);
    return { type, principal, start, mora, freq, n, ratePeriod, method, skipSundays, termMonths: months, interestMode, interestValue };
  };
  const prev = () => {
    $s('#fred').hidden = type !== 'reditos'; $s('#fcuo').hidden = type !== 'cuotas';
    $s('#lsunw').hidden = $s('#lfq').value !== 'diario';
    const p = params(), out = $s('#lprev');
    if (!(p.principal > 0)) { out.textContent = 'Escribe el monto.'; return; }
    if (p.type === 'reditos') {
      $s('#lmatw').textContent = p.maturityDate ? `El cliente paga el interés cada semana y devuelve el capital a más tardar el ${fdate(p.maturityDate)}. Después de esa fecha el préstamo sale como vencido.` : 'Sin fecha fija: el capital se devuelve cuando el cliente pueda.';
      out.innerHTML = p.rateWeekly > 0 ? `${renew ? `Nuevo capital: <b>${money(p.principal)}</b><br>` : ''}Interés: <b>${money(p.principal * p.rateWeekly)}</b> por semana · <b>${money(p.principal * p.rateWeekly / 7)}</b> por día<br>${p.maturityDate ? `Vence el capital: <b>${fdate(p.maturityDate)}</b> · Interés en el plazo si no abona: <b style="color:var(--green)">${money(p.principal * p.rateWeekly / 7 * daysBetween(p.start, p.maturityDate))}</b>` : 'El interés corre cada día sobre el capital que quede.'}` : 'Escribe el porcentaje.';
      return;
    }
    if (!(p.n > 0)) { out.textContent = 'Escribe el número de cuotas.'; return; }
    const sc = buildSchedule({ principal: p.principal, rate: p.ratePeriod, n: p.n, freq: p.freq, method: p.method, start: p.start, skipSundays: p.skipSundays });
    const total = r2(sc.reduce((t, x) => t + x.amount, 0));
    out.innerHTML = `${renew ? `Nuevo préstamo: <b>${money(p.principal)}</b><br>` : ''}Cuota: <b>${money(sc[0].amount)}</b> ${FREQ[p.freq].toLowerCase()}${p.method === 'frances' ? ' (la última puede variar)' : ''}<br>
      Total a pagar: <b>${money(total)}</b> · Ganancia: <b style="color:var(--green)">${money(total - p.principal)}</b><br>
      Primera cuota: ${fdate(sc[0].due)} · Última: ${fdate(sc[sc.length - 1].due)}
      <details style="margin-top:6px"><summary>Ver calendario</summary>${scheduleTable({ schedule: sc }, '0000-00-00')}</details>`;
  };
  sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { months = parseInt(b.dataset.m, 10); markMonths(); prev(); });
  sh.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { type = b.dataset.t; sh.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); prev(); });
  sh.querySelectorAll('[data-r]').forEach(ch => ch.onclick = () => {
    sh.querySelectorAll('[data-r]').forEach(x => x.classList.remove('on')); ch.classList.add('on');
    rate = ch.dataset.r === 'otro' ? 'otro' : parseFloat(ch.dataset.r);
    $s('#lother').hidden = rate !== 'otro'; prev();
  });
  sh.querySelectorAll('input,select').forEach(el => { el.addEventListener('input', prev); el.addEventListener('change', prev); });
  prev();
  if (quote) return;
  $s('#lsave').onclick = async () => {
    const p = params();
    const cash = r2(parseFloat($s('#la').value) || 0);
    if (!(p.principal > 0)) return toast('Escribe el monto');
    if (daysBetween(p.start, todayStr()) < 0) return toast('La fecha no puede ser futura');
    if (p.type === 'reditos' && !(p.rateWeekly > 0)) return toast('Escribe el porcentaje');
    if (p.type === 'cuotas' && !(p.n > 0)) return toast('Escribe el número de cuotas');
    if (p.mora.type !== 'none' && !(p.mora.value > 0)) return toast('Escribe el valor de la mora o elige "Sin mora"');
    // Revisión del cliente antes de prestar
    const warn = [];
    if (c.blacklist) warn.push(`⚠️ Este cliente está en LISTA NEGRA${c.blacklistReason ? ': ' + c.blacklistReason : ''}.`);
    if (!renew) {
      const h = clientHistory(rows(await getDocs(qLoansByClient(c.id))));
      if (h.lateNow) warn.push(`⚠️ Tiene ${h.lateNow} préstamo(s) atrasado(s) ahora mismo (${h.maxLate} días).`);
      if (h.bad) warn.push(`⚠️ Tiene ${h.bad} préstamo(s) incobrable(s) en su historial.`);
      if (h.active && !h.lateNow) warn.push(`Tiene ${h.active} préstamo(s) activo(s).`);
    }
    const plazo = p.termMonths ? ` a ${p.termMonths} ${p.termMonths === 1 ? 'mes' : 'meses'}` : '';
    const desc = p.type === 'reditos' ? `${pct(p.rateWeekly)} semanal (réditos)${plazo}` : `${p.n} cuotas ${FREQ[p.freq].toLowerCase()}es${plazo}, ${pct(p.ratePeriod)} por cuota`;
    if (!confirm(`${warn.length ? warn.join('\n') + '\n\n' : ''}¿${renew ? 'Renovar' : 'Crear'} préstamo de ${money(p.principal)} a ${desc} para ${c.name}?`)) return;
    const base = {
      clientId: c.id, clientName: c.name, clientPhone: c.phone || '', collectorId: c.collectorId || me.uid,
      type: p.type, principal: p.principal, startDate: p.start, mora: p.mora,
      collateral: $s('#lcol').value.trim(), note: $s('#lnote').value.trim(),
      accruedInterest: 0, accruedMora: 0, lastCalcDate: p.start, lastPaymentDate: null, lastPaymentId: null,
      totalInterestPaid: 0, totalCapitalPaid: 0, totalMoraPaid: 0, moraPaid: 0, moraWaived: 0,
      status: 'activo', createdBy: me.uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      ...(renew ? { renewedFrom: renew.id, carriedOver: carried } : {})
    };
    const data = p.type === 'reditos'
      ? { ...base, rateWeekly: p.rateWeekly, capitalBalance: p.principal, termMonths: p.termMonths || 0, maturityDate: p.maturityDate }
      : { ...base, freq: p.freq, n: p.n, ratePeriod: p.ratePeriod, method: p.method, skipSundays: p.skipSundays, capitalBalance: p.principal,
          termMonths: p.termMonths || 0, interestMode: p.interestMode, interestValue: p.interestValue,
          schedule: buildSchedule({ principal: p.principal, rate: p.ratePeriod, n: p.n, freq: p.freq, method: p.method, start: p.start, skipSundays: p.skipSundays }) };
    const btn = $s('#lsave'); btn.disabled = true;
    try {
      const ref = doc(collection(db, 'loans'));
      const b = writeBatch(db);
      b.set(ref, data);
      if (renew) b.update(doc(db, 'loans', renew.id), { status: 'renovado', renewedTo: ref.id, renewedAmount: carried, updatedAt: serverTimestamp() });
      await b.commit();
      if (cash > 0) await cashMove({ type: 'desembolso', amount: cash, uid: me.uid, loanId: ref.id, clientName: c.name, note: renew ? 'Renovación' : 'Préstamo nuevo' });
      closeModal(); toast(renew ? 'Préstamo renovado' : 'Préstamo creado'); openLoan(ref.id);
    } catch (e) { toast(errMsg(e)); btn.disabled = false; }
  };
}

// ---------- CAJA (cuadre, gastos, entregas) ----------
async function viewCaja(date = todayStr(), who = isAdmin() ? 'all' : me.uid) {
  const [pays, moves] = await Promise.all([getDocs(qPaysByDate(date)), getDocs(qMovesByDate(date))]);
  const P = rows(pays).filter(p => who === 'all' || p.byUid === who).sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
  const M = rows(moves).filter(m => who === 'all' || m.uid === who);
  const ok = P.filter(p => !p.anulado);
  const s = (arr, f) => r2(arr.reduce((t, x) => t + (f(x) || 0), 0));
  const cobrado = s(ok, p => p.amount), efectivo = s(ok.filter(p => (p.method || 'efectivo') === 'efectivo'), p => p.amount);
  const tm = t => s(M.filter(m => m.type === t), m => m.amount);
  const entregas = tm('entrega'), gastos = tm('gasto'), desemb = tm('desembolso'), devol = tm('devolucion');
  const enMano = r2(entregas + efectivo - gastos - desemb - devol);
  const label = { entrega: 'Entrega de efectivo', gasto: 'Gasto', desembolso: 'Préstamo entregado', devolucion: 'Efectivo devuelto' };
  view.innerHTML = `<h2>Caja</h2>
    <div class="grid"><input id="cd" type="date" value="${date}">
      ${isAdmin() ? `<select id="cw"><option value="all">Todos</option>${usersCache.map(u => `<option value="${u.id}" ${u.id === who ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>` : '<div></div>'}</div>
    <div class="card">
      <div class="row"><span>Cobrado</span><b>${money(cobrado)}</b></div>
      <div class="row mute"><span>En efectivo</span><span>${money(efectivo)}</span></div>
      <div class="row mute"><span>Transferencia / otro</span><span>${money(cobrado - efectivo)}</span></div>
      <div class="row"><span>+ Efectivo recibido de la oficina</span><b>${money(entregas)}</b></div>
      <div class="row"><span>− Gastos</span><b>${money(gastos)}</b></div>
      <div class="row"><span>− Préstamos entregados</span><b>${money(desemb)}</b></div>
      <div class="row"><span>− Efectivo devuelto a la oficina</span><b>${money(devol)}</b></div>
      <hr style="border:0;border-top:1px solid var(--line)">
      <div class="row"><span><b>Efectivo que debe tener en mano</b></span><span class="big">${money(enMano)}</span></div>
    </div>
    <div class="btns"><button class="btn sec" id="mg">➖ Gasto</button>${isAdmin() ? '<button class="btn sec" id="me">➕ Entrega</button><button class="btn sec" id="md">↩️ Devolución</button>' : ''}</div>
    <h3>Pagos (${ok.length})</h3>
    ${P.length ? P.map(p => `<div class="card tap" data-id="${p.id}" style="${p.anulado ? 'opacity:.5' : ''}">
      <div class="row"><b>${esc(p.clientName)}</b><b>${money(p.amount)}</b></div>
      <div class="mute">${METHODS[p.method] || 'Efectivo'} · Interés ${money((p.toInterest || 0) + (p.toMora || 0))} · Capital ${money(p.toCapital)} · ${esc(p.byName)}${p.anulado ? ' · ANULADO' : ''}</div></div>`).join('')
      : '<div class="empty">No hay pagos en esta fecha.</div>'}
    <h3>Movimientos de caja</h3>
    ${M.length ? M.map(m => `<div class="card"><div class="row"><b>${label[m.type] || m.type}</b><b>${money(m.amount)}</b></div>
      <div class="mute">${esc([m.category, m.clientName, m.note].filter(Boolean).join(' · '))} · ${esc(m.personName || collectorName(m.uid))}</div>
      ${isAdmin() ? `<button class="btn warn sm" data-del="${m.id}">Borrar</button>` : ''}</div>`).join('')
      : '<div class="empty">Sin movimientos.</div>'}`;
  const reload = () => viewCaja($('#cd').value, $('#cw') ? $('#cw').value : who).catch(e => toast(errMsg(e)));
  $('#cd').onchange = reload; if ($('#cw')) $('#cw').onchange = reload;
  view.querySelectorAll('[data-id]').forEach(el => el.onclick = () => showReceipt(P.find(p => p.id === el.dataset.id)));
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Borrar este movimiento?')) return;
    await deleteDoc(doc(db, 'cashmoves', b.dataset.del)); toast('Borrado'); reload();
  });
  const moveForm = type => {
    const people = isAdmin() ? usersCache : [{ id: me.uid, name: me.name }];
    const sh = openModal(`<h2>${label[type]}</h2>
      ${isAdmin() ? `<label>${type === 'gasto' ? 'Quién hizo el gasto' : 'Cobrador'}</label><select id="mw">${people.map(u => `<option value="${u.id}" ${u.id === (who === 'all' ? me.uid : who) ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>` : ''}
      <label>Monto (RD$)</label><input id="ma" type="number" inputmode="decimal" step="0.01">
      ${type === 'gasto' ? `<label>Categoría</label><select id="mc"><option>Combustible</option><option>Transporte</option><option>Comida</option><option>Teléfono / recarga</option><option>Papelería</option><option>Pago a empleado</option><option>Otro</option></select>` : ''}
      <label>Nota</label><input id="mn">
      <button class="btn" id="ms">Guardar</button>`);
    sh.querySelector('#ms').onclick = async () => {
      const amount = r2(parseFloat(sh.querySelector('#ma').value));
      if (!(amount > 0)) return toast('Escribe el monto');
      const uid = sh.querySelector('#mw') ? sh.querySelector('#mw').value : me.uid;
      try {
        await cashMove({ type, amount, uid, personName: (usersCache.find(u => u.id === uid) || me).name, date: $('#cd').value || todayStr(),
          category: sh.querySelector('#mc') ? sh.querySelector('#mc').value : '', note: sh.querySelector('#mn').value.trim() });
        closeModal(); toast('Guardado'); reload();
      } catch (e) { toast(errMsg(e)); }
    };
  };
  $('#mg').onclick = () => moveForm('gasto');
  if ($('#me')) $('#me').onclick = () => moveForm('entrega');
  if ($('#md')) $('#md').onclick = () => moveForm('devolucion');
}

async function viewReportes(from, to) {
  const today = todayStr();
  from = from || today.slice(0, 8) + '01'; to = to || today;
  const [ps, ms, ls] = await Promise.all([
    getDocs(query(collection(db, 'payments'), where('date', '>=', from), where('date', '<=', to))),
    getDocs(query(collection(db, 'cashmoves'), where('date', '>=', from), where('date', '<=', to))),
    getDocs(query(collection(db, 'loans'), where('status', '==', 'activo')))
  ]);
  const P = rows(ps).filter(p => !p.anulado), M = rows(ms), L = rows(ls);
  const s = (a, k) => r2(a.reduce((t, x) => t + (x[k] || 0), 0));
  const gastos = s(M.filter(m => m.type === 'gasto'), 'amount'), desemb = s(M.filter(m => m.type === 'desembolso'), 'amount');
  const interes = s(P, 'toInterest'), mora = s(P, 'toMora');
  let capital = 0, vencido = 0, late = 0; L.forEach(x => { const st = loanStatus(x, today); capital += st.capital; vencido += st.dueNow; if (st.late) late++; });
  const byCol = {}; P.forEach(p => { const k = p.byName || '—'; byCol[k] = (byCol[k] || 0) + p.amount; });
  const byCat = {}; M.filter(m => m.type === 'gasto').forEach(m => { const k = m.category || 'Otro'; byCat[k] = (byCat[k] || 0) + m.amount; });
  view.innerHTML = `<button class="btn sec sm" id="back">← Más</button><h2>Reportes</h2>
    <div class="grid"><div><label>Desde</label><input id="rf" type="date" value="${from}"></div><div><label>Hasta</label><input id="rt" type="date" value="${to}"></div></div>
    <div class="grid">
      <div class="stat"><span>Total cobrado</span><b>${money(s(P, 'amount'))}</b></div>
      <div class="stat"><span>Pagos</span><b>${P.length}</b></div>
      <div class="stat"><span>Interés cobrado</span><b>${money(interes)}</b></div>
      <div class="stat"><span>Mora cobrada</span><b>${money(mora)}</b></div>
      <div class="stat"><span>Capital recuperado</span><b>${money(s(P, 'toCapital'))}</b></div>
      <div class="stat"><span>Dinero prestado</span><b>${money(desemb)}</b></div>
      <div class="stat"><span>Gastos</span><b>${money(gastos)}</b></div>
      <div class="stat"><span>Ganancia neta</span><b style="color:var(--green)">${money(interes + mora - gastos)}</b></div>
    </div>
    <h3>Cartera hoy</h3>
    <div class="grid">
      <div class="stat"><span>Capital en la calle</span><b>${money(capital)}</b></div>
      <div class="stat"><span>Vencido por cobrar</span><b>${money(vencido)}</b></div>
      <div class="stat"><span>Préstamos activos</span><b>${L.length}</b></div>
      <div class="stat"><span>Atrasados</span><b>${late}</b></div>
    </div>
    <h3>Cobrado por persona</h3><div class="card"><table>${Object.entries(byCol).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${money(v)}</td></tr>`).join('') || '<tr><td class="mute">Sin pagos</td></tr>'}</table></div>
    <h3>Gastos por categoría</h3><div class="card"><table>${Object.entries(byCat).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${money(v)}</td></tr>`).join('') || '<tr><td class="mute">Sin gastos</td></tr>'}</table></div>
    <button class="btn sec" id="rexp">📥 Exportar pagos y caja de estas fechas</button>`;
  $('#back').onclick = () => go('mas');
  const re = () => viewReportes($('#rf').value, $('#rt').value).catch(e => toast(errMsg(e)));
  $('#rf').onchange = re; $('#rt').onchange = re;
  $('#rexp').onclick = () => {
    downloadCsv(`pagos_${from}_${to}.csv`, ['Fecha', 'Cliente', 'Monto', 'Mora', 'Interés', 'Capital', 'Forma', 'Cobrado por', 'Nota'],
      P.map(p => [p.date, p.clientName, p.amount, p.toMora || 0, p.toInterest, p.toCapital, METHODS[p.method] || 'Efectivo', p.byName, p.note]));
    downloadCsv(`caja_${from}_${to}.csv`, ['Fecha', 'Tipo', 'Monto', 'Categoría', 'Persona', 'Cliente', 'Nota'],
      M.map(m => [m.date, m.type, m.amount, m.category || '', m.personName || collectorName(m.uid), m.clientName || '', m.note || '']));
  };
}

    const v = id => sh.querySelector(id).value.trim();
    settings = { ...settings, businessName: v('#bn') || 'Préstamos 4Squina', lenderName: v('#bl'), lenderCedula: v('#bc'), lenderAddress: v('#ba'), city: v('#bci'),
      defaultMora: { type: v('#bmt'), value: parseFloat(v('#bmv')) || 0, grace: parseInt(v('#bmg'), 10) || 0 } };
    try { await setDoc(doc(db, 'meta', 'settings'), settings, { merge: true }); $('#bizName').textContent = settings.businessName; closeModal(); toast('Guardado'); }
    catch (e) { toast(errMsg(e)); }
  };
}

async function viewEquipo() {
  await loadUsers();
  view.innerHTML = `<button class="btn sec sm" id="back">← Más</button><h2>Equipo</h2>
    <div class="card">${usersCache.map(u => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
      <div><b>${esc(u.name)}</b><div class="mute">${u.role === 'admin' ? 'Administrador' : 'Cobrador'}${u.active === false ? ' · <span style="color:var(--red)">desactivado</span>' : ''}</div></div>
      ${u.id !== me.uid ? `<button class="btn sm sec" data-tog="${u.id}">${u.active === false ? 'Activar' : 'Desactivar'}</button>` : '<span class="mute">Tú</span>'}
    </div>`).join('')}</div>
    <h3>Agregar persona</h3>
    <div class="card">
      <label>Nombre</label><input id="un">
      <label>Código de acceso (6 a 10 números)</label><input id="up" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off">
      <label>Rol</label><select id="ur"><option value="cobrador">Cobrador (solo ve sus clientes)</option><option value="admin">Administrador (ve todo)</option></select>
      <button class="btn" id="uadd">Crear cuenta</button>
    </div>`;
  $('#back').onclick = () => go('mas');
  view.querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
    const u = usersCache.find(x => x.id === b.dataset.tog);
    await updateDoc(doc(db, 'users', u.id), { active: u.active === false });
    toast('Actualizado'); viewEquipo();
  });
  $('#uadd').onclick = async () => {
    const name = $('#un').value.trim(), code = $('#up').value.trim(), role = $('#ur').value;
    if (!name) return toast('Escribe el nombre');
    if (!validCode(code)) return toast('El código debe tener de 6 a 10 números');
    const email = codeEmail(code);
    $('#uadd').disabled = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth2, email, codePass(code));
      await setDoc(doc(db, 'users', cred.user.uid), { name, email, role, active: true, createdAt: serverTimestamp() });
      await signOut(auth2);
      toast(`Cuenta creada. ${name} entra con su código.`); viewEquipo();
    } catch (e) { toast(errMsg(e)); $('#uadd').disabled = false; }
  };
}
</script>
